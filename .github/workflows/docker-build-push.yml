name: Build & Push to Registry

on:
  push:
    branches:
      - development

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Private Registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ secrets.REGISTRY_URL }} -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin

      - name: Build Docker Image
        run: docker build -t ${{ secrets.REGISTRY_URL }}/myapp:${{ github.sha }} .

      - name: Push Docker Image
        run: docker push ${{ secrets.REGISTRY_URL }}/myapp:${{ github.sha }}