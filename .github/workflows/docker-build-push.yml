name: Build & Deploy Docker (Java 22)

on:
  push:
    branches:
      - development

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java 22
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 22

      # 3. Build JAR
      - name: Build JAR
        run: mvn clean package -DskipTests

      # 4. Clean Docker cache untuk runner fresh
      - name: Clean Docker cache
        run: docker system prune -af

      # 5. Docker login
      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # 6. Build Docker image fresh
      - name: Build Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          IMAGE_NAME=${{ secrets.REGISTRY_URL }}/${{ secrets.REGISTRY_USERNAME }}/hotel-booking-service:$IMAGE_TAG
          docker build --no-cache -t $IMAGE_NAME .
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      # 7. Push SHA tag dulu
      - name: Push SHA tag
        run: docker push ${{ env.IMAGE_NAME }}

      # 8. Tag latest dan push terpisah
      - name: Tag and push latest
        run: |
          docker tag ${{ env.IMAGE_NAME }} ${{ secrets.REGISTRY_URL }}/${{ secrets.REGISTRY_USERNAME }}/hotel-booking-service:latest
          docker push ${{ secrets.REGISTRY_URL }}/${{ secrets.REGISTRY_USERNAME }}/hotel-booking-service:latest

      # 9. Deploy ke server via SSH
      - name: Deploy to Server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "Login ke private registry di server"
            echo ${{ secrets.REGISTRY_PASSWORD }} | docker login ${{ secrets.REGISTRY_URL }} -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin
            echo "Pull image SHA terbaru"
            docker pull ${{ env.IMAGE_NAME }}
            echo "Pull image latest"
            docker pull ${{ secrets.REGISTRY_URL }}/${{ secrets.REGISTRY_USERNAME }}/hotel-booking-service:latest
            cd /home/deploy/app
            docker compose down
            docker compose up -d
