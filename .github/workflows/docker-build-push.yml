name: Build & Deploy Docker (Java 22)

on:
  push:
    branches:
      - development

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 22

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Docker login
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          IMAGE_NAME=${{ secrets.REGISTRY_URL }}/${{ secrets.REGISTRY_USERNAME }}/hotel-booking-service:$IMAGE_TAG
          docker build --no-cache -t $IMAGE_NAME .
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Push SHA tag
        run: docker push ${{ env.IMAGE_NAME }}

      - name: Tag and push latest
        run: |
          docker tag ${{ env.IMAGE_NAME }} ${{ secrets.REGISTRY_URL }}/${{ secrets.REGISTRY_USERNAME }}/hotel-booking-service:latest
          docker push ${{ secrets.REGISTRY_URL }}/${{ secrets.REGISTRY_USERNAME }}/hotel-booking-service:latest

      - name: Deploy to Server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo ${{ secrets.REGISTRY_PASSWORD }} | docker login ${{ secrets.REGISTRY_URL }} -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin
            docker pull ${{ env.IMAGE_NAME }}
            docker tag ${{ env.IMAGE_NAME }} hotel-booking-service:latest
            cd /home/deploy/app
            docker compose down
            docker compose up -d
